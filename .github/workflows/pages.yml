name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # A stale hash would ship a page whose script the browser refuses to run
      - name: Check CSP hashes
        run: node tools/update-csp.mjs --check

      - name: Build site
        run: |
          mkdir -p _site
          cp sonicview.html _site/index.html
          cp sonicview.html _site/sonicview.html
          # Offline bundle: the app plus the Windows launchers
          zip -j _site/sonicview-offline.zip sonicview.html SonicView.bat "Add Desktop Shortcut.bat" LICENSE

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
