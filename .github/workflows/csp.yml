name: CSP check

# sonicview.html allows its inline <script> and <style> by SHA-256 hash. If either changes without
# re-running tools/update-csp.mjs, browsers refuse to run the app, so fail the pull request instead.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  csp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: CSP hashes match the inline script and style
        run: node tools/update-csp.mjs --check
